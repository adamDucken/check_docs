[package]
name = "check-docs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "CLI for inspecting exact local Rust dependency APIs from Cargo-resolved Rustdoc JSON"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adamDucken/check_docs"
readme = "README.md"
keywords = ["rustdoc", "cargo", "documentation", "dependencies", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

[[bin]]
name = "check-docs"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.18"
rustdoc-types = "0.56.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing"] }

[dev-dependencies]
tempfile = "3"
